<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BoxPeach — Breathe with intention</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #fdf5e8;
      color: #1a1a1a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      text-align: center;
    }
    .logo { width: 120px; height: 120px; object-fit: contain; margin-bottom: 16px; }
    h1 { font-size: 2.4rem; font-weight: 700; color: #f9a660; margin-bottom: 12px; }
    .tagline { font-size: 1.1rem; color: rgba(0,0,0,0.55); max-width: 440px; line-height: 1.6; }
    .badge {
      margin-top: 40px;
      display: inline-block;
      background: #f9a660;
      color: rgba(0,0,0,0.80);
      font-size: 1rem;
      font-weight: 600;
      padding: 14px 32px;
      border-radius: 50px;
      text-decoration: none;
    }
    .badge:hover { opacity: 0.85; }
    footer {
      margin-top: 60px;
      font-size: 0.8rem;
      color: rgba(0,0,0,0.35);
    }
    footer a { color: rgba(0,0,0,0.45); text-decoration: none; margin: 0 8px; }
    footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <img src="PeachMascot.png" alt="BoxPeach mascot" class="logo" />
  <h1>BoxPeach</h1>
  <p class="tagline">A calm little breathing buddy for your pocket. Box breathing in four equal sides — inhale, hold, exhale, hold.</p>
  <a class="badge" href="https://apps.apple.com/app/boxpeach" target="_blank">Download on the App Store</a>
  <footer>
    <p>&copy; 2026 BoxPeach</p>
    <p style="margin-top:8px;">
      <a href="/privacy">Privacy Policy</a>
      <a href="/terms">Terms of Service</a>
      <a href="mailto:chuckchuckapps@gmail.com">Support</a>
    </p>
  </footer>
</body>
</html>
